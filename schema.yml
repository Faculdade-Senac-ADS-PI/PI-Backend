    ServicoCreateUpdate:
      type: object
      description: |-
        Serializer para criacao e atualizacao de servicos.

        Usado apenas para escrita (POST, PUT, PATCH).
        O campo 'usuario' e definido automaticamente pelo viewset.

        Campos aceitos:
            - titulo: titulo do servico (obrigatorio)
            - descricao: descricao detalhada (obrigatorio)
            - categoria: ID da categoria (obrigatorio)
            - preco: valor do servico (opcional)
            - tipo_preco: 'fixo' ou 'a_combinar' (opcional, padrao: fixo)
            - localizacao: cidade/estado (opcional)
            - ativo: true/false (opcional, padrao: true)

        Exemplo de requisicao:
            POST /api/v1/servicos/
            {
                "titulo": "Desenvolvimento de site institucional",
                "descricao": "Crio sites modernos e responsivos...",
                "categoria": 1,
                "preco": 2500.00,
                "tipo_preco": "fixo",
                "localizacao": "Sao Paulo, SP"
            }
      properties:
        titulo:
          type: string
          description: Titulo descritivo do servico
          maxLength: 200
        descricao:
          type: string
          description: Descricao detalhada do servico oferecido
        categoria:
          type: integer
          description: Categoria do servico
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Preco do servico (deixe vazio para 'A Combinar')
        tipo_preco:
          allOf:
          - $ref: '#/components/schemas/TipoPrecoEnum'
          title: Tipo de Preco
          description: |-
            Tipo do preco: fixo ou a combinar

            * `fixo` - Preco Fixo
            * `a_combinar` - A Combinar
        localizacao:
          type: string
          description: Cidade e estado onde o servico e oferecido
          maxLength: 200
        ativo:
          type: boolean
          description: Se o servico esta disponivel para contratacao
      required:
      - categoria
      - descricao
      - titulo
